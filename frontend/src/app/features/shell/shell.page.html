<a class="skip-link" href="#main-content">Skip to content</a>

<div class="app" [class.app--collapsed]="layout.railCollapsed()">
  <div class="drawer-backdrop" [class.drawer-backdrop--on]="layout.sidebarOpen()" (click)="layout.sidebarOpen.set(false)" aria-hidden="true"></div>

  <aside id="dataset-drawer" class="sidebar" [class.sidebar--open]="layout.sidebarOpen()" (keydown.escape)="layout.sidebarOpen.set(false)" aria-label="Navigation">
    <span class="brandbar" aria-hidden="true"></span>
    <div class="sidebar__brand">
      <a class="brand" routerLink="/datasets" aria-label="Data Quality home">
        <span class="brand__mark" aria-hidden="true"><img src="wevioo-logo.png" alt="" width="265" height="155" /></span>
        @if (!layout.railCollapsed()) {
          <span class="brand__text"><strong>Data Quality</strong></span>
        }
      </a>
    </div>

    <div class="sidebar__cta">
      <button type="button" class="new-btn" [class.new-btn--icon]="layout.railCollapsed()" (click)="layout.openUpload()" aria-keyshortcuts="N" title="New analysis (N)">
        <app-icon name="plus" [size]="18" />
        @if (!layout.railCollapsed()) {
          <span>New analysis</span>
          <span class="kbd kbd--dark">N</span>
        }
      </button>
    </div>

    <app-dataset-sidebar [now]="now()" [collapsed]="layout.railCollapsed()" />

    <div class="sidebar__footer">
      <button type="button" class="side-btn collapse-btn" (click)="layout.toggleCollapsed()" [attr.aria-label]="layout.railCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
        <app-icon [name]="layout.railCollapsed() ? 'chevronRight' : 'chevronLeft'" [size]="16" />
        @if (!layout.railCollapsed()) {
          <span>Collapse</span>
        }
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button
        type="button"
        class="btn btn--ghost btn--icon topbar__menu"
        aria-label="Show datasets"
        aria-controls="dataset-drawer"
        [attr.aria-expanded]="layout.sidebarOpen()"
        (click)="layout.sidebarOpen.set(!layout.sidebarOpen())"
      ><app-icon name="menu" /></button>

      <button type="button" class="search-trigger" (click)="layout.paletteOpen.set(true)" aria-keyshortcuts="Control+K Meta+K">
        <app-icon name="search" [size]="16" />
        <span class="search-trigger__text">Search datasets, tables, actions…</span>
        <span class="search-trigger__keys"><span class="kbd">{{ isMac ? '⌘' : 'Ctrl' }}</span><span class="kbd">K</span></span>
      </button>

      <div class="topbar__actions">

        <button
          type="button"
          class="btn btn--ghost btn--icon"
          [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
          [attr.aria-pressed]="theme.isDark()"
          (click)="theme.toggle()"
        ><app-icon [name]="theme.isDark() ? 'sun' : 'moon'" /></button>

        <div class="menu">
          <button
            type="button"
            class="user-button"
            aria-haspopup="menu"
            [attr.aria-expanded]="userMenuOpen()"
            (click)="userMenuOpen.set(!userMenuOpen())"
          >
            <span class="avatar" aria-hidden="true">{{ (auth.username() ?? '?').charAt(0).toUpperCase() }}</span>
            <span class="user-button__name">{{ auth.username() }}</span>
            <app-icon name="chevronDown" [size]="14" />
          </button>
          @if (userMenuOpen()) {
            <div class="menu__panel" animate.leave="menu__panel--leave" role="menu" (keydown.escape)="userMenuOpen.set(false)">
              <p class="menu__caption">Signed in as <strong>{{ auth.username() }}</strong> · Administrator</p>
              <button type="button" role="menuitem" class="menu__item" (click)="userMenuOpen.set(false); layout.paletteOpen.set(true)">
                <app-icon name="keyboard" [size]="16" /> Shortcuts & search
              </button>
              <button type="button" role="menuitem" class="menu__item" (click)="logout()">
                <app-icon name="logout" [size]="16" /> Sign out
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <main id="main-content" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>

<app-upload-dialog />
<app-command-palette (signOut)="logout()" />
