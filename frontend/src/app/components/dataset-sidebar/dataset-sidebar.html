<aside class="dataset-list">
  <div class="section-title">
    <h2>Datasets</h2>
    <span>{{ datasets.length }}</span>
  </div>

  @if (datasets.length === 0 && !loading) {
    <p class="empty">No uploaded datasets yet.</p>
  }

  @for (dataset of datasets; track dataset.id) {
    <div
      class="dataset-item"
      role="button"
      tabindex="0"
      [class.active]="selectedDatasetId === dataset.id"
      (click)="datasetSelected.emit(dataset)"
      (keydown.enter)="datasetSelected.emit(dataset)"
      (keydown.space)="datasetSelected.emit(dataset)"
    >
      <div class="dataset-copy">
        <span class="name">{{ dataset.name }}</span>
        <span class="meta">{{ dataset.sourceType }} / v{{ dataset.latestVersion?.versionNumber ?? 0 }}</span>
        <span class="badge" [class]="statusClass(dataset.latestVersion?.status)">
          {{ dataset.latestVersion?.status ?? 'NEW' }}
        </span>
      </div>
      <button
        type="button"
        class="delete-dataset-button"
        title="Delete dataset"
        [disabled]="deletingDatasetId === dataset.id"
        (click)="datasetDeleted.emit({ dataset, event: $event })"
      >
        {{ deletingDatasetId === dataset.id ? 'Deleting' : 'Delete' }}
      </button>
    </div>
  }
</aside>
