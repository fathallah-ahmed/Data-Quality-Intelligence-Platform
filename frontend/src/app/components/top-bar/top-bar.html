<header class="topbar">
  <div>
    <p class="eyebrow">Data Quality Platform</p>
    <h1>Dataset analysis workspace</h1>
  </div>
  <div class="top-actions">
    <button type="button" class="icon-button" title="Refresh data" (click)="refresh.emit()">
      {{ refreshing ? 'Syncing...' : 'Refresh' }}
    </button>
    @if (authenticated) {
      <button type="button" class="ghost-button" title="Log out" (click)="logout.emit()">Logout</button>
    }
  </div>
</header>
