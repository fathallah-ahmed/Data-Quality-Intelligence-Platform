spring.application.name=backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/dq-platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:500MB}

app.storage-root=${APP_STORAGE_ROOT:../Data_Quality_Wevioo/data/uploads}

# Airflow REST API used to trigger and inspect DAG runs.
app.airflow-base-url=${AIRFLOW_BASE_URL:http://localhost:8080}
app.airflow-username=${AIRFLOW_USERNAME:admin}
app.airflow-password=${AIRFLOW_PASSWORD:admin}
app.airflow-dag-id=${AIRFLOW_DAG_ID:data_quality_analysis_pipeline}
app.airflow-debug=${AIRFLOW_DEBUG:false}
app.airflow-connect-timeout-ms=${AIRFLOW_CONNECT_TIMEOUT_MS:5000}
app.airflow-read-timeout-ms=${AIRFLOW_READ_TIMEOUT_MS:15000}
app.pipeline-backend-url=${PIPELINE_BACKEND_URL:http://host.docker.internal:8081}

# Local model that turns a written request into corrections (the pipeline uses the same Ollama).
# The model must be set (OLLAMA_MODEL); run-backend.ps1 reads it from Data_Quality_Wevioo\.env.
app.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ollama-model=${OLLAMA_MODEL:}
app.ollama-timeout-ms=${OLLAMA_TIMEOUT_MS:120000}

# Neo4j, where the Graph tab builds the graph of a version (docker compose -f docker-compose.neo4j.yml up -d).
# The password is a development default: set NEO4J_PASSWORD before sharing this instance.
app.neo4j-uri=${NEO4J_URI:bolt://localhost:7687}
app.neo4j-user=${NEO4J_USER:neo4j}
app.neo4j-password=${NEO4J_PASSWORD:dq-neo4j-dev}

# Watchdog for runs stuck in PENDING/RUNNING (Airflow down, DAG paused, lost callback).
app.watchdog-interval-ms=${WATCHDOG_INTERVAL_MS:60000}
app.watchdog-stale-after-minutes=${WATCHDOG_STALE_AFTER_MINUTES:10}
app.watchdog-max-run-minutes=${WATCHDOG_MAX_RUN_MINUTES:180}

app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Security. Defaults are for local development only: a WARN is logged at startup when
# they are used, and app.strict-secrets=true refuses to start with them.
app.admin-username=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD:admin123}
app.pipeline-api-token=${PIPELINE_API_TOKEN:dev-pipeline-token}
app.jwt-secret=${JWT_SECRET:dev-jwt-secret-change-me-at-least-32-bytes!!}
app.jwt-ttl-minutes=${JWT_TTL_MINUTES:480}
app.strict-secrets=${STRICT_SECRETS:false}
