spring.application.name=backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/dq-platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:500MB}

app.storage-root=${APP_STORAGE_ROOT:../Data_Quality_Wevioo/data/uploads}
app.airflow-base-url=${AIRFLOW_BASE_URL:http://localhost:8080}
app.airflow-username=${AIRFLOW_USERNAME:admin}
app.airflow-password=${AIRFLOW_PASSWORD:admin}
app.airflow-dag-id=${AIRFLOW_DAG_ID:data_quality_analysis_pipeline}
app.pipeline-backend-url=${PIPELINE_BACKEND_URL:http://host.docker.internal:8081}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.admin-username=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD:admin123}
app.pipeline-api-token=${PIPELINE_API_TOKEN:dev-pipeline-token}
